name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: .NET API — build, test, coverage, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore dmb-sidecar.sln

      - name: Build
        run: dotnet build dmb-sidecar.sln --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test tests/DmbSidecar.Api.Tests/DmbSidecar.Api.Tests.csproj
          --configuration Release
          --no-build
          --settings tests/DmbSidecar.Api.Tests/coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=dotnet.trx"

      - name: Coverage summary
        run: |
          COV_FILE="$(find TestResults -name coverage.cobertura.xml | head -1)"
          LINE_RATE="$(grep -o 'line-rate="[0-9.]*"' "$COV_FILE" | head -1 | cut -d'"' -f2)"
          BRANCH_RATE="$(grep -o 'branch-rate="[0-9.]*"' "$COV_FILE" | head -1 | cut -d'"' -f2)"
          LINE_PCT="$(python3 -c "print(f'{float(\"$LINE_RATE\") * 100:.1f}')")"
          BRANCH_PCT="$(python3 -c "print(f'{float(\"$BRANCH_RATE\") * 100:.1f}')")"
          echo "## .NET coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value | Gate |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Line | **${LINE_PCT}%** | ≥ 55% |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${BRANCH_PCT}% | — |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **coverage-dotnet-html** artifact for line-by-line report." >> "$GITHUB_STEP_SUMMARY"

      - name: Install ReportGenerator
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate HTML coverage report
        run: |
          COV_FILE="$(find TestResults -name coverage.cobertura.xml | head -1)"
          reportgenerator \
            "-reports:$COV_FILE" \
            "-targetdir:coveragereport" \
            "-reporttypes:Html;HtmlSummary" \
            "-assemblyfilters:+DmbSidecar.Api"

      - name: Upload .NET coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-dotnet
          path: TestResults/**/coverage.cobertura.xml

      - name: Upload .NET coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-dotnet-html
          path: coveragereport/

      - name: Install CycloneDX CLI
        run: |
          dotnet tool install --global CycloneDX
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate .NET SBOM
        run: >
          dotnet-CycloneDX src/DmbSidecar.Api/DmbSidecar.Api.csproj
          -o sbom/dotnet
          -fn sbom-dotnet.json
          -F Json

      - name: Upload .NET SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-dotnet
          path: sbom/dotnet/sbom-dotnet.json

  python:
    name: MCP bridge — test, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/DmbSidecar.McpBridge/requirements.txt
          pip install -r src/DmbSidecar.McpBridge/requirements-dev.txt

      - name: Pytest with coverage
        run: pytest tests/python -q

      - name: Python coverage summary
        run: |
          RATE="$(python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('tests/python/coverage-python.xml').getroot().get('line-rate'); print(f'{float(r)*100:.1f}')")"
          echo "## Python coverage (lineup_engine)" >> "$GITHUB_STEP_SUMMARY"
          echo "**${RATE}%** line coverage (gate ≥ 80%)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Python coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: tests/python/coverage-python.xml

      - name: Generate Python SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements src/DmbSidecar.McpBridge/requirements.txt -o sbom-python.json

      - name: Upload Python SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-python
          path: sbom-python.json

  extension:
    name: Chrome extension — build, test, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install and build
        working-directory: extension
        run: |
          npm ci --cache /tmp/npm-cache-dmb
          npm run build
          npm test

      - name: Verify committed extension/dist matches src
        run: |
          git diff --exit-code extension/dist || (
            echo "::error::extension/dist is stale — run 'cd extension && npm run build' and commit dist"
            exit 1
          )

      - name: Extension coverage summary
        working-directory: extension
        run: |
          if [[ -f coverage/coverage-summary.json ]]; then
            PCT="$(node -e "const s=require('./coverage/coverage-summary.json'); const k=Object.keys(s).find(x=>x.includes('lineup-format'))||'total'; console.log(s[k].lines.pct)")"
          else
            PCT="(see test log — vitest thresholds enforce ≥90%)"
          fi
          echo "## Extension coverage (lineup-format)" >> "$GITHUB_STEP_SUMMARY"
          echo "**${PCT}%** line coverage (gate ≥ 90%)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload extension coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-extension
          path: extension/coverage/

      - name: Generate npm SBOM
        working-directory: extension
        run: |
          npm exec --cache /tmp/npm-cache-dmb -- @cyclonedx/cyclonedx-npm --output-file ../sbom-extension.json

      - name: Upload extension SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-extension
          path: sbom-extension.json
